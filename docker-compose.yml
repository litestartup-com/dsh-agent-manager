# 蜂群2计划 P2：脊柱 compose —— nginx + manager + 主脑。
# 工蜂（个人与向导新增节点）由 manager 经 docker.sock 动态拉起（P2b 对账）。
#
# 用法：
#   bash scripts/gen-env.sh           # 生成 .env（幂等，已有值不覆盖；填 DEEPSEEK_API_KEY）
#   cp manager.config.container.example.yaml manager.config.yaml
#   docker compose up -d --build
#
# 主脑 = 脊柱（compose 声明，非托管：up/down 409，状态/日志只读）。
name: ohdsh

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - manager
    networks: [hive]

  manager:
    build:
      context: .
      dockerfile: images/manager/Dockerfile
    image: ohdsh/manager:${MANAGER_VERSION:-1.0.1}
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
      - ./manager.config.yaml:/app/manager.config.yaml:ro
      - ./data:/app/data
      # 工蜂生命周期：manager 经宿主机 dockerd 管理本机节点容器（Portainer 同款模式）
      - /var/run/docker.sock:/var/run/docker.sock
      # 工作区在宿主机与容器内走同一绝对路径（/opt/ohdsh/workspaces），
      # 这样 manager 发给 dockerd 的 bind mount 路径在宿主机上真实存在。
      - ./workspaces:/opt/ohdsh/workspaces
    depends_on:
      - node-brain
    restart: unless-stopped
    networks: [hive]

  node-brain:
    build:
      context: images/node
      dockerfile: Dockerfile
    image: ${DSH_NODE_IMAGE:-ohdsh/dsh-node:0.1.1-rc.2}
    user: "1000:1000"
    command: ["--port", "3082"]
    environment:
      DSH_HOME: /data
      GW_KEY: ${GW_KEY_B}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      BRAIN_TOKEN: ${BRAIN_TOKEN}
    volumes:
      - ohdsh-brain:/data
      - ./workspaces/brain:/workspace
    restart: unless-stopped
    networks: [hive]

volumes:
  ohdsh-brain:

networks:
  hive:
