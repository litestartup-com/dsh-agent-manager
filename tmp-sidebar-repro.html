<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="file:///C:/Users/Administrator/Documents/deepseek-workspace/dsh-agent-manager/public/assets/style.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-server" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <rect x="2.5" y="2.75" width="11" height="10.5" rx="1.25" /><path d="M2.5 6.75h11" />
    <circle cx="5" cy="4.9" r="0.9" fill="currentColor" stroke="none" /><circle cx="8" cy="4.9" r="0.9" fill="currentColor" stroke="none" /><circle cx="11" cy="4.9" r="0.9" fill="currentColor" stroke="none" /><path d="M5 9.5h6" />
  </g>
  <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75V8l2.25 1.5"/></g>
  <g id="i-archive" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.25" y="3" width="11.5" height="3" rx="0.75"/><path d="M3.25 6v6.25a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V6M6.5 8.75h3" stroke-linecap="round"/></g>
  <g id="i-coin" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="M8 5.5v5M5.75 7h4.5a1 1 0 0 1 0 2H5.75a1 1 0 0 0 0 2h4.5"/></g>
  <g id="i-logout" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.75h4.25a1 1 0 0 1 1 1v8.5a1 1 0 0 1-1 1H9M6 8h7.25M10.5 5.5 13.25 8l-2.75 2.5M5.5 2.5v11"/></g>
</defs></svg>

<aside id="sidebar" class="sidebar">
  <div class="side-top">
    <a class="brand" href="/"><span class="brand-mark">蜂</span>
      <span class="brand-text">Oh! dsh<svg width="12" height="12"><use href="#i-up"/></svg></span>
    </a>
  </div>

  <div id="side-brain">
    <div class="side-brain-card open">
      <div class="side-brain-head">
        <button class="side-brain-btn" type="button"><span class="side-brain-icon" aria-hidden="true">🐝</span>
          <span class="side-brain-main"><span class="side-brain-name">主脑</span>
          <span class="side-brain-sub">总控 agent</span></span></button>
        <button class="side-brain-ghost" type="button" aria-expanded="true">⌄</button>
        <span class="side-brain-div" aria-hidden="true"></span>
        <button class="side-brain-ghost" type="button">＋</button>
      </div>
      <div class="brain-chats">
        <div class="chat-item"><a class="tree-child chat-row" href="#"><svg width="13" height="13"><use href="#i-archive"/></svg><span class="chat-row-main"><span class="label">周报任务</span></span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><svg width="13" height="13"><use href="#i-archive"/></svg><span class="chat-row-main"><span class="label">看看状态</span></span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><svg width="13" height="13"><use href="#i-archive"/></svg><span class="chat-row-main"><span class="label">第三会话</span></span></a></div>
      </div>
    </div>
  </div>

  <div class="side-section"><span class="grow">Agents</span><span id="agent-count">1</span></div>

  <nav id="agent-nav" class="tree" aria-label="agent 列表">
    <div class="tree-group open" data-agent="personal">
      <div class="tree-item">
        <button class="tree-toggle" type="button" aria-expanded="true"><span class="chev">›</span><span class="rail-badge" aria-hidden="true">个</span><span class="label">个人</span></button>
        <button class="tree-side" type="button">⊞</button><button class="tree-side" type="button">＋</button>
      </div>
      <div class="tree-children">
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">笔记整理</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">交易记录</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">复盘</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">第四会话</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">第五会话</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">第六会话</span></a></div>
        <div class="chat-item"><a class="tree-child chat-row" href="#"><span class="label">第七会话</span></a></div>
      </div>
    </div>
  </nav>

  <div class="side-links">
    <a class="side-link" href="/nodes" data-nav="nodes" id="nodes-link">
      <svg width="14" height="14"><use href="#i-server" /></svg>
      <span class="grow">节点</span>
      <span id="nodes-hint" class="muted small">2/2</span>
    </a>
    <a class="side-link" href="/crons" data-nav="crons"><svg width="14" height="14"><use href="#i-clock" /></svg><span class="grow">定时任务</span><span id="cron-hint" class="muted small"></span></a>
    <a class="side-link" href="/archive" data-nav="archive"><svg width="14" height="14"><use href="#i-archive" /></svg><span class="grow">已归档</span><span id="archive-hint" class="muted small"></span></a>
    <a class="side-link" href="/spend" data-nav="spend"><svg width="14" height="14"><use href="#i-coin" /></svg><span class="grow">花费</span><span id="spend-hint" class="muted small">$0.11</span></a>
  </div>

  <div class="side-endpoints" id="side-endpoints"></div>

  <div class="side-foot">
    <span id="avatar" class="side-avatar" aria-hidden="true">a</span>
    <span id="who" class="grow">admin</span>
    <button id="logout" class="icon-btn" type="button" aria-label="退出登录" title="退出登录">
      <svg width="15" height="15" aria-hidden="true"><use href="#i-logout" /></svg>
    </button>
  </div>
</aside>

<main class="content "><p>main</p></main>

<div id="probe"></div>
<script>
const r = (id) => {
  const el = document.getElementById(id)
  const b = el.getBoundingClientRect()
  return { top: Math.round(b.top), bottom: Math.round(b.bottom), h: Math.round(b.height), visible: el.offsetParent !== null }
}
const out = {
  vh: window.innerHeight,
  nodesLink: r('nodes-link'),
  links: r('side-links') && document.querySelector('.side-links').getBoundingClientRect().toJSON(),
  foot: (() => { const b = document.querySelector('.side-foot').getBoundingClientRect(); return { top: Math.round(b.top), bottom: Math.round(b.bottom) } })(),
  tree: (() => { const b = document.getElementById('agent-nav').getBoundingClientRect(); return { top: Math.round(b.top), bottom: Math.round(b.bottom), scrollH: document.getElementById('agent-nav').scrollHeight, clientH: document.getElementById('agent-nav').clientHeight } })(),
  sidebar: (() => { const b = document.getElementById('sidebar').getBoundingClientRect(); return { top: Math.round(b.top), bottom: Math.round(b.bottom), scrollH: document.getElementById('sidebar').scrollHeight } })(),
}
document.getElementById('probe').textContent = 'PROBE:' + JSON.stringify(out)
</script>
</body>
</html>
