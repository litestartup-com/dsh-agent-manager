# 蜂群2计划 P2：TLS 模式二 —— Let's Encrypt（certbot --nginx）。
# 先用本文件（80 直通）跑起 nginx 再执行 certbot --nginx -d __APP_DOMAIN__，
# certbot 会自行改写为 443 + 证书配置。存为 default.conf 前替换 __APP_DOMAIN__。
server {
    listen 80;
    server_name __APP_DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
