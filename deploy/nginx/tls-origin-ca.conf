# 蜂群2计划 P2：TLS 模式一 —— Cloudflare Origin CA（证书文件由用户放置）。
# 用法：把 __APP_DOMAIN__ / __SSL_CERT_PATH__ / __SSL_KEY_PATH__ 替换后存为 default.conf。
# IP 或其它 Host 的 80 访问统一 301 到正式域名（IP 直连不会"死"，而是跳到域名）。
server {
    listen 80 default_server;
    server_name _;
    return 301 https://__APP_DOMAIN__$request_uri;
}

server {
    listen 80;
    server_name __APP_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __APP_DOMAIN__;
    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
