<div class="wrap">
  <div id="banners" role="alert"></div>

  <section class="hero">
    <h1>要它做什么？</h1>
    <p>给 agent 派活，它会写进自己的工作区，并自动提交</p>

    <form id="run-form" class="composer">
      <div class="composer-pills">
        <span class="pill">
          <svg width="13" height="13"><use href="#i-folder" /></svg>
          <select id="run-agent" class="pill-select" required aria-label="交给哪个 agent"></select>
        </span>
        <!-- Filled in once the agent list arrives; hidden until then so it
             does not paint as an empty outline. -->
        <span id="run-scope" class="pill" hidden></span>
      </div>

      <textarea
        id="run-prompt"
        rows="2"
        required
        aria-label="要做什么"
        placeholder="例：在工作日志里记一行，今天把 manager 的 runner 写完了"
      ></textarea>

      <div class="composer-foot">
        <!-- The identity line, inside the same field of view as the send
             button: sending to the wrong agent writes to the wrong workspace
             (UI.md §0). -->
        <span class="composer-identity" id="run-identity">
          <span id="run-who" class="who"></span>
          <span id="run-path" class="path"></span>
        </span>
        <span id="run-state" class="composer-state"></span>
        <button id="run-submit" class="send" type="submit" aria-label="开始">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-up" /></svg>
        </button>
      </div>

      <!-- Suggested ways to use the composer. Honest, static, dismissible:
           no data source to keep in sync, and a night's worth of prompts is
           not worth inventing. -->
      <div class="suggest" id="suggest" hidden>
        <div class="suggest-head">
          <span class="suggest-title">可以这样派</span>
          <button id="suggest-hide" class="icon-btn" type="button" aria-label="收起建议" title="收起建议">
            <svg width="14" height="14" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="suggest-grid" id="suggest-grid"></div>
      </div>
    </form>

    <div id="run-result"></div>

    <nav class="quickbar" aria-label="快捷入口">
      <a id="quick-board" class="quick-link" href="#">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-board" /></svg>
        大盘
      </a>
      <a class="quick-link" href="/crons">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-clock" /></svg>
        定时任务
      </a>
      <a class="quick-link" href="/spend">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-coin" /></svg>
        花费
      </a>
      <a class="quick-link" href="/archive">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-archive" /></svg>
        已归档
      </a>
    </nav>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>最近的任务</h2>
    </div>
    <div class="card">
      <div id="runs" class="list">
        <div class="skeleton"></div>
        <div class="skeleton w60"></div>
      </div>
    </div>
  </section>
</div>
