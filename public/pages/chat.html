<!-- The conversation page has no header of its own: DSH's own view leads with
     the transcript, and the chat's title still reaches the browser tab and the
     narrow-screen app bar through `shell:title`. Rename/archive live on the
     sidebar row menu, where they already were. -->

<!-- Session state and concurrency notices. Kept above the transcript rather than
     next to the composer: `lost` disables sending, so the reason has to be
     readable without scrolling to the bottom. -->
<div id="chat-notices" class="chat-notices" aria-live="polite"></div>

<div id="chat-log" class="chat-log" aria-live="polite" aria-busy="false">
  <div class="turn skeleton-turn">
    <div class="skeleton w40"></div>
    <div class="skeleton"></div>
    <div class="skeleton w60"></div>
  </div>
</div>

<form id="chat-composer" class="composer" autocomplete="off">
  <div class="composer-row">
    <textarea
      id="chat-input"
      class="composer-input"
      rows="1"
      placeholder="说点什么…"
      aria-label="消息"
      disabled
    ></textarea>
  </div>
  <!-- The bottom operations row, DSH's InputBar pattern: content (the text
       above) stays free, and this row is split into three slots --
         tools (left):  agent identity pill + workspace path
         modes (middle): reserved for future controls (preset/model selectors…)
         trailing (right): state hint, stop, and the send button, always last.
       Future features land in `composer-tools` / `composer-modes` without
       touching the layout. Never hidden, at any width -- UI.md §0 puts the
       agent identity in the send button's field of view. -->
  <div id="composer-identity" class="composer-bar">
    <div class="composer-tools">
      <span id="composer-agent" class="composer-agent"></span>
      <span id="composer-path" class="composer-path"></span>
    </div>
    <div class="composer-modes" id="composer-modes" hidden></div>
    <div class="composer-trailing">
      <span id="composer-hint" class="composer-hint"></span>
      <button id="chat-stop" class="btn-quiet composer-send" type="button" hidden>停止</button>
      <button id="chat-send" class="btn-primary composer-send" type="submit" disabled aria-label="发送">
        <svg width="16" height="16" aria-hidden="true"><use href="#i-up" /></svg>
      </button>
    </div>
  </div>
</form>

<div id="chat-toast" class="toast" role="status" aria-live="polite"></div>
